<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17"/>
      <stop offset="100%" style="stop-color:#141b2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e63946"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Car body -->
  <path d="M130 320 L160 250 Q170 230 190 230 L320 230 Q340 230 350 250 L380 320 Z" fill="url(#accent)" opacity="0.9"/>
  <rect x="110" y="300" width="290" height="50" rx="15" fill="url(#accent)"/>
  <!-- Windows -->
  <path d="M175 300 L195 250 L255 250 L255 300 Z" fill="#0a0e17" opacity="0.6"/>
  <path d="M265 300 L265 250 L315 250 L335 300 Z" fill="#0a0e17" opacity="0.6"/>
  <!-- Wheels -->
  <circle cx="185" cy="355" r="30" fill="#1a1a2e" stroke="#e63946" stroke-width="4"/>
  <circle cx="185" cy="355" r="12" fill="#e63946" opacity="0.5"/>
  <circle cx="330" cy="355" r="30" fill="#1a1a2e" stroke="#e63946" stroke-width="4"/>
  <circle cx="330" cy="355" r="12" fill="#e63946" opacity="0.5"/>
  <!-- Text MC -->
  <text x="256" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="80" fill="white" opacity="0.95">MC</text>
  <!-- Admin badge -->
  <rect x="310" y="140" width="90" height="30" rx="15" fill="#e63946"/>
  <text x="355" y="161" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="white">ADMIN</text>
</svg>
